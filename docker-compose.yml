version: "3.8"

name: saasbod-server

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV}
        PORT: ${PORT}
        DATABASE: ${DATABASE}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
        JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
        JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
        JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
        PUBLIC_LINK_SECRET: ${PUBLIC_LINK_SECRET}
        PUBLIC_LINK_EXPIRES_IN: ${PUBLIC_LINK_EXPIRES_IN}
        API_URL: ${API_URL}
        FRONTEND_URL: ${FRONTEND_URL}
        EMAIL_HOST: ${EMAIL_HOST}
        EMAIL_PORT: ${EMAIL_PORT}
        EMAIL_SECURE: ${EMAIL_SECURE}
        EMAIL_REQUIRE_TLS: ${EMAIL_REQUIRE_TLS}
        EMAIL_TLS_REJECT_UNAUTHORIZED: ${EMAIL_TLS_REJECT_UNAUTHORIZED}
        EMAIL_ADDRESS: ${EMAIL_ADDRESS}
        EMAIL_FROM: ${EMAIL_FROM}
        EMAIL_PASSWORD: ${EMAIL_PASSWORD}
        EMAIL_TO: ${EMAIL_TO}
        COMPANY_NAME: ${COMPANY_NAME}
        B2_APPLICATION_KEY_ID: ${B2_APPLICATION_KEY_ID}
        B2_APPLICATION_KEY: ${B2_APPLICATION_KEY}
        B2_BUCKET_ID: ${B2_BUCKET_ID}
        B2_BUCKET_NAME: ${B2_BUCKET_NAME}
        B2_PUBLIC_BASE_URL: ${B2_PUBLIC_BASE_URL}
        PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
        PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
        PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
        SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL}
        SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
        SEED_COMPANY_NAME: ${SEED_COMPANY_NAME}
    container_name: saasbod-server
    ports:
      - "6620:6620"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - saasbod-network

networks:
  saasbod-network:
    driver: bridge
